<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人网站</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#0f172a;
      color:white;
      text-align:center;
    }

    header{
      padding:100px 20px;
      background:linear-gradient(135deg,#2563eb,#7c3aed);
    }

    h1{
      font-size:60px;
      margin-bottom:20px;
    }

    p{
      font-size:22px;
      color:#e2e8f0;
    }

    .btn{
      display:inline-block;
      margin-top:30px;
      padding:15px 35px;
      background:white;
      color:#111827;
      border-radius:12px;
      text-decoration:none;
      font-size:20px;
      font-weight:bold;
    }

    section{
      padding:80px 20px;
    }

    .card{
      max-width:700px;
      margin:auto;
      background:#1e293b;
      padding:40px;
      border-radius:20px;
    }

    footer{
      padding:30px;
      color:#94a3b8;
    }
  </style>
</head>

<body>

<header>
  <h1>欢迎来到我的网站 🚀</h1>
  <p>这是我第一次制作的网站</p>

  <a class="btn" href="#">联系我</a>
</header>

<section>
  <div class="card">
    <h2>关于我</h2>

    <p>
      我正在学习网页开发、GitHub 和 AI。
      <br><br>
      这是我的个人主页。
    </p>
  </div>
</section>

<footer>
  © 2026 我的个人网站
</footer>

</body>
</html>
